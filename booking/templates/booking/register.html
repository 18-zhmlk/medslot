<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Lumi Clinic</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #BAD1DF;
            color: #222;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .auth-card h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .auth-subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #222;
        }

        .sms-row {
            display: flex;
            gap: 10px;
        }

        .sms-row input {
            flex: 1;
        }

        .sms-button {
            height: 44px;
            padding: 0 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .sms-button:hover {
            background: #f0f0f0;
        }

        .sms-message {
            margin-top: 7px;
            font-size: 13px;
            color: #777;
        }

        .auth-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #015A84;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .auth-button:hover {
            background: #5D96B0;
        }

        .auth-error {
            background: #fff0f0;
            color: #a00000;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .auth-login {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .auth-login a {
            color: #222;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>Регистрация</h1>
        <div class="auth-subtitle">Создайте аккаунт Lumi Clinic</div>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>ИИН</label>
                <input type="text" name="iin" maxlength="12" minlength="12" inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label>ФИО</label>
                <input type="text" name="full_name" required>
            </div>

            <div class="form-group">
                <label>Номер телефона</label>
                <div class="sms-row">
                    <input type="text" name="phone" id="phone" required>
                    <button type="button" class="sms-button" onclick="sendCode()">Получить код</button>
                </div>
                <div class="sms-message" id="smsMessage"></div>
            </div>

            <div class="form-group">
                <label>SMS-код</label>
                <input type="text" name="sms_code" maxlength="4" inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Повторите пароль</label>
                <input type="password" name="password2" required>
            </div>

            <button type="submit" class="auth-button">
                Зарегистрироваться
            </button>
        </form>

        <div class="auth-login">
            Уже есть аккаунт?
            <a href="{% url 'login' %}">Войти</a>
        </div>
    </div>
</div>

<script>
function sendCode() {
    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("smsMessage");

    if (!phone) {
        message.textContent = "Сначала введите номер телефона.";
        return;
    }

    message.textContent = "Код отправлен. Для демонстрации используйте 1111.";
}
</script>

</body>
</html>
